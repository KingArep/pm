name: Deploy to Heroku

# Auto-deploy to Heroku on every push to main.
#
# Why this workflow instead of Heroku's own GitHub integration: this app is on
# the **container** stack (`heroku.yml` -> `Dockerfile`), and the dashboard
# "Automatic deploys" toggle is only offered for buildpack apps. Pushing an
# image to `registry.heroku.com/<app>/web` is the supported path for container
# stacks.
#
# ── WHAT WAS BROKEN ──────────────────────────────────────────────────────────
# It promoted `ghcr.io/<repo>:native`. That is a MOVING tag and nothing
# rebuilds it on a push — `release.yml` is workflow_dispatch-only — so the job
# was green while Heroku kept running an older binary (observed: the live app
# answered `build: "0.1.0"`, i.e. an image built without `.git`, so `build.rs`
# fell back to `CARGO_PKG_VERSION` and every client showed "Update available").
#
# Now the deploy is PINNED to an immutable per-commit tag, `:sha-<7>`, which
# `release.yml`'s docker-manifest job publishes on every run. If that tag does
# not exist yet, this job dispatches `release.yml` (Docker-only) and waits for
# the image instead of deploying something else. Nothing is built here.
#
# Required repository secret: HEROKU_API_KEY
#   Get it with `heroku authorizations:create -d "github-actions pm-server"`
#   or from https://dashboard.heroku.com/account/applications
#   Add it with `gh secret set HEROKU_API_KEY` (or Settings -> Secrets -> Actions).

on:
  push:
    branches: [main]
    # A commit that only touches CI, docs or scratch tools CANNOT change the
    # binary, so it must not force a release build: this workflow pins
    # `:sha-<short>`, that tag would not exist, and the "Find (or trigger)"
    # step below would dispatch a full `release.yml` for an image identical to
    # the previous commit's. Everything that can change the binary is
    # deliberately absent from this list: `src/`, `public/`, `build.rs`,
    # `Cargo.*`, `Dockerfile*`, `desktop/`.
    paths-ignore:
      - ".github/**"
      - "**.md"
      - "docs/**"
      - "plans/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
  # Lets you re-deploy without an empty commit (Actions tab -> Run workflow).
  workflow_dispatch:
    inputs:
      image:
        # Reuse a build that already exists instead of building this commit.
        # Needed after a CI/docs-only commit (there is no image for it) and when
        # a promotion has to be retried without touching source.
        description: "Promote an ALREADY-published tag (e.g. sha-8ad2f40) instead of building this commit"
        required: false
        default: ""

# Never run two deploys at once; a later push cancels an in-flight older one.
concurrency:
  group: heroku-deploy
  cancel-in-progress: true

permissions:
  contents: read
  # Pull this repository's own published image.
  packages: read
  # Dispatch `release.yml` when the pinned image does not exist yet.
  actions: write

env:
  HEROKU_APP: pm-server
  IMAGE: ghcr.io/${{ github.repository }}
  # How long to wait for `release.yml` to publish `:sha-<short>`.
  IMAGE_WAIT_SECONDS: "1500"

jobs:
  deploy:
    name: Release this commit's image to Heroku
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The Heroku git fallback below needs a full clone.
          fetch-depth: 0

      # Fail fast with a clear message instead of a confusing auth error.
      - name: Check for HEROKU_API_KEY
        run: |
          if [ -z "${{ secrets.HEROKU_API_KEY }}" ]; then
            echo "::error::Repository secret HEROKU_API_KEY is not set."
            echo "Create one with: heroku authorizations:create -d \"github-actions\""
            echo "Then add it:      gh secret set HEROKU_API_KEY"
            exit 1
          fi

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Heroku CLI, not a raw registry login: `container:release` is the
      # supported release path and it also does the registry login. The previous
      # `PATCH /formation` returned HTTP 200 yet the dyno kept running the old
      # image (`build: 0.1.0`) — green deploy, stale app, twice.
      - name: Install the Heroku CLI
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku --version

      - name: Log in to the Heroku registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          heroku container:login 2>&1 | tail -n 2 || true

      # ── resolve the exact image for THIS commit ─────────────────────────────
      - name: Find (or trigger) this commit's image
        id: img
        env:
          GH_TOKEN: ${{ github.token }}
          SHA7: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A human pin wins, and it is the ONLY way an older image is reused.
          # A CI/docs-only commit has no image of its own (see `paths-ignore`)
          # and its binary is identical to the previous commit's, so rebuilding
          # it is pure waste. The automatic path below NEVER falls back to an
          # older image on its own — deploying something other than this commit
          # silently is the exact "green deploy, stale app" bug this workflow
          # exists to remove (a live app reporting `build: 0.1.0` while CI was
          # green). Reuse therefore has to be an explicit, logged decision.
          OVERRIDE="$(printf '%s' "${{ github.event.inputs.image }}" | tr -d '[:space:]')"
          if [ -n "$OVERRIDE" ]; then
            # Accept either a bare tag (`sha-8ad2f40`) or a full ref pasted
            # from a `docker pull` line (`ghcr.io/<repo>:sha-8ad2f40`).
            OVERRIDE="${OVERRIDE#ghcr.io/}"
            OVERRIDE="${OVERRIDE#"${GITHUB_REPOSITORY}:"}"
            OVERRIDE="${OVERRIDE#${IMAGE}:}"
            if ! docker manifest inspect "${IMAGE}:${OVERRIDE}" >/dev/null 2>&1; then
              echo "::error::${IMAGE}:${OVERRIDE} is not published in GHCR - cannot promote it"
              exit 1
            fi
            echo "ref=${IMAGE}:${OVERRIDE}" >> "$GITHUB_OUTPUT"
            echo "::notice::Promoting the already-published image ${IMAGE}:${OVERRIDE} (no build)"
            exit 0
          fi

          SHA7="$(printf '%s' "$SHA7" | cut -c1-7)"
          REF="${IMAGE}:sha-${SHA7}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Pinned image: ${REF}"

          # Already published by an earlier `release.yml` run for this commit?
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "::notice::Using the already-published image ${REF}"
            exit 0
          fi

          # Not yet: ask `release.yml` for a Docker-only build of this commit and
          # WAIT for the tag. Waiting on the registry (not on a run id) keeps the
          # logic simple and is immune to the dispatch/list race.
          #
          # But never dispatch when a release run for THIS commit is already
          # queued or running. That check is the difference between one release
          # run and three: a push makes this job run while a human
          # `workflow_dispatch` for the same SHA is still building, the registry
          # lookup above legitimately misses (the image is not pushed yet), and
          # the dispatch then duplicated the whole build as `github-actions[bot]`.
          # The wait below is identical either way, so an in-flight run is simply
          # awaited.
          INFLIGHT="$(gh run list --workflow release.yml --commit "$GITHUB_SHA" \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "${INFLIGHT:-0}" -gt 0 ]; then
            echo "::notice::release.yml already queued/running for $GITHUB_SHA (${INFLIGHT}) - waiting for ${REF} instead of dispatching a duplicate"
          else
            echo "::notice::${REF} is not published yet - dispatching release.yml (Docker-only)"
            gh workflow run release.yml --ref main -f tag="" || {
              echo "::error::Could not dispatch release.yml"
              exit 1
            }
          fi

          deadline=$(( $(date +%s) + IMAGE_WAIT_SECONDS ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if docker manifest inspect "$REF" >/dev/null 2>&1; then
              echo "::notice::${REF} published"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out after ${IMAGE_WAIT_SECONDS}s waiting for ${REF}."
          echo "Check the latest 'Release Builder & Docker Publish' run."
          exit 1

      # ── promote it (no rebuild, no source in the image) ─────────────────────
      #
      # ── WHY THIS IS NOT `docker pull` + `docker push` ───────────────────────
      # `:sha-<short>` is a MULTI-ARCH MANIFEST LIST: `release.yml` assembles
      # `native-amd64` + `native-arm64` with `imagetools create`. Two things
      # break the obvious promotion:
      #
      #   1. A tag that resolves to an index is ALSO STORED AS AN INDEX, so
      #      `docker push` re-uploads the whole list — including the arm64
      #      manifest whose layers were never downloaded here.
      #   2. Heroku's registry stores exactly one kind of artifact: a
      #      SINGLE-platform linux/amd64 image in Docker v2 schema 2 media
      #      types. An OCI index is rejected outright.
      #
      # Observed, and why this comment exists:
      #
      #   4f4fb700ef54: Unavailable          <- arm64 blobs, never pulled
      #   error from registry: unsupported   <- the index itself
      #
      # Both architectures still stay published on GHCR (render.yaml pulls
      # `:native`, which must remain a list). Only the PROMOTION is narrowed to
      # the architecture a dyno actually runs.
      - name: Deploy the pinned image
        id: image
        continue-on-error: true
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          REF: ${{ steps.img.outputs.ref }}
        run: |
          set -euo pipefail
          DST="registry.heroku.com/${HEROKU_APP}/web"

          # Resolve the linux/amd64 sub-manifest digest. Registry-side only, no
          # image is pulled. A tag that is already a plain manifest (no
          # `.Manifest.Manifests`) prints nothing here and is used as-is.
          AMD64="$(
            docker buildx imagetools inspect --format \
              '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{.Digest}}{{"\n"}}{{end}}' \
              "$REF" 2>/dev/null |
              awk '$1 == "linux/amd64" { print $2; exit }' || true
          )"
          if [ -n "$AMD64" ]; then SRC="${REF}@${AMD64}"; else SRC="$REF"; fi
          echo "Promoting ${SRC}"
          echo "       -> ${DST}"

          # skopeo copies ONE platform and rewrites the manifest to Docker v2
          # schema 2 (`--format v2s2`), which is what Heroku accepts. `--all=false`
          # is explicit so a future default cannot silently turn this back into
          # the index push that failed with "unsupported".
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq skopeo >/dev/null 2>&1 || true
          fi
          if command -v skopeo >/dev/null 2>&1; then
            AUTH=()
            if [ -f "$HOME/.docker/config.json" ]; then
              AUTH=(--authfile "$HOME/.docker/config.json")
            fi
            skopeo copy --all=false --override-os linux --override-arch amd64 \
              --format v2s2 "${AUTH[@]}" "docker://${SRC}" "docker://${DST}"
          else
            echo "::warning::skopeo unavailable - falling back to a single-manifest docker pull/push"
            docker pull "$SRC"
            docker tag "$SRC" "$DST"
            docker push "$DST"
          fi

          # A stored index would deploy green and then crash the dyno at exec,
          # so refuse to release one.
          if docker buildx imagetools inspect --raw "$DST" 2>/dev/null |
               grep -qE 'image\.index|manifest\.list'; then
            echo "::error::${DST} holds a manifest index/OCI index - Heroku dynos cannot run it."
            exit 1
          fi

          # The real release. A bare `PATCH /formation` answered 200 without
          # rolling the dyno (the app kept serving the old build), so this uses
          # the CLI, which fails loudly when it cannot release.
          heroku container:release web -a "$HEROKU_APP"
          echo "--- recent releases"
          heroku releases -a "$HEROKU_APP" --num 3 || true

      # Fallback: no image for this commit (release.yml failed, or the registry
      # push was rejected) -> let Heroku build from the commit, which is the slow
      # path this job exists to avoid but must keep working so a push is never a
      # red deploy.
      - name: Deploy by building on Heroku (fallback)
        if: steps.image.outcome != 'success'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "::notice::No pinned image; building on Heroku instead."
          set -euo pipefail

          # Heroku authenticates with the API key as the password and any
          # non-empty username. Keeping it in an env var (never in the URL on
          # disk) avoids leaking it into git config / process listings.
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git"

          # Deploy the exact commit CI checked out.
          git push --force heroku "HEAD:refs/heads/main"

          if curl -sS --max-time 30 \
               -H "Accept: application/vnd.heroku+json; version=3" \
               -H "Authorization: Bearer ${HEROKU_API_KEY}" \
               "https://api.heroku.com/apps/${HEROKU_APP}/releases" \
               -o /tmp/releases.json; then
            grep -o '"version":[0-9]*' /tmp/releases.json | head -n 1 || true
          else
            echo "Deploy succeeded; release lookup was skipped."
          fi
          echo "Deployed ${HEROKU_APP} at commit ${GITHUB_SHA}."

      # ── prove what is actually running ─────────────────────────────────────
      # The whole point of this workflow is "the commit reached production", so
      # read it back from the app instead of trusting the push. A `build` of
      # "0.1.0" means the binary was compiled without `.git` (no `git describe`),
      # i.e. the stale/Heroku-built image is live again.
      - name: Verify the deployed build
        if: always() && steps.image.outcome == 'success'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -uo pipefail
          URL="$(curl -sS -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer ${HEROKU_API_KEY}" \
            "https://api.heroku.com/apps/${HEROKU_APP}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin).get("web_url",""))')"
          [ -n "$URL" ] || URL="https://stream.pencarimovie.com"
          # Heroku's `web_url` ends with a SLASH (`https://<app>.herokuapp.com/`),
          # so `${URL}/api/version` produced `…herokuapp.com//api/version`. Some
          # proxies and the dashboard's URL checks treat that as a different path.
          while [ "${URL%/}" != "$URL" ]; do URL="${URL%/}"; done
          echo "Probing ${URL}/api/version"

          for i in $(seq 1 30); do
            BODY="$(curl -sS -m 20 "${URL}/api/version" || true)"
            if printf '%s' "$BODY" | grep -q '"build"'; then break; fi
            sleep 4
          done
          echo "$BODY"
          BUILD="$(printf '%s' "$BODY" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
          echo "build=${BUILD}"
          if [ "$BUILD" = "0.1.0" ]; then
            echo "::warning::The live binary reports build 0.1.0 - it was compiled without .git/tags, so it is NOT this commit's image."
          fi
